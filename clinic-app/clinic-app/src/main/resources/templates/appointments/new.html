<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Запись к врачу</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div class="page">
<h1>Запись к врачу</h1>
<nav>
    <a th:href="@{/dashboard}">Личный кабинет</a>
    <a th:href="@{/appointments/search}">Поиск записей</a>
</nav>

<form th:action="@{/appointments}" method="post" th:object="${appointment}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

    <label>
        ФИО пациента
        <input type="text" th:field="*{patientName}" required minlength="3" maxlength="120">
    </label>
    <div th:if="${#fields.hasErrors('patientName')}" th:errors="*{patientName}"></div>

    <label>
        Телефон
        <input type="tel" th:field="*{phone}" required pattern="[0-9+()\-\s]{7,20}">
    </label>
    <div th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>

    <label>
        Email
        <input type="email" th:field="*{email}" required>
    </label>
    <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>

    <label>
        Врач
        <select th:field="*{doctorId}" required>
            <option value="">Выберите врача</option>
            <option th:each="doctor : ${doctors}" th:value="${doctor.id}"
                    th:text="${doctor.fullName + ' - ' + doctor.specialization}"></option>
        </select>
    </label>
    <div th:if="${#fields.hasErrors('doctorId')}" th:errors="*{doctorId}"></div>

    <label>
        Услуга
        <select th:field="*{medicalServiceId}" required>
            <option value="">Выберите услугу</option>
            <option th:each="service : ${services}" th:value="${service.id}"
                    th:text="${service.name + ' (' + service.price + ')'}"></option>
        </select>
    </label>
    <div th:if="${#fields.hasErrors('medicalServiceId')}" th:errors="*{medicalServiceId}"></div>

    <label>
        Дата и время
        <input type="datetime-local" th:field="*{appointmentTime}" required>
    </label>
    <div th:if="${#fields.hasErrors('appointmentTime')}" th:errors="*{appointmentTime}"></div>

    <label>
        Жалоба
        <textarea th:field="*{complaint}" required minlength="10" maxlength="1000"></textarea>
    </label>
    <div th:if="${#fields.hasErrors('complaint')}" th:errors="*{complaint}"></div>

    <label>
        <input type="checkbox" th:field="*{consent}" required>
        Я согласен на обработку персональных данных
    </label>
    <div th:if="${#fields.hasErrors('consent')}" th:errors="*{consent}"></div>

    <button type="submit">Отправить заявку</button>
</form>
</div>
</body>
</html>
