<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Врачи</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div class="page">
<h1>Врачи</h1>
<nav>
    <a th:href="@{/admin}">Панель администратора</a>
    <a th:href="@{/admin/doctors/new}">Добавить врача</a>
</nav>

<table>
    <thead>
    <tr>
        <th>ФИО</th>
        <th>Специализация</th>
        <th>Стаж</th>
        <th>Кабинет</th>
        <th>Активен</th>
        <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="doctor : ${doctors}">
        <td th:text="${doctor.fullName}">ФИО</td>
        <td th:text="${doctor.specialization}">Специализация</td>
        <td th:text="${doctor.experienceYears}">0</td>
        <td th:text="${doctor.office}">101</td>
        <td th:text="${doctor.active ? 'Да' : 'Нет'}">Да</td>
        <td>
            <a th:href="@{/admin/doctors/{id}/edit(id=${doctor.id})}">Редактировать</a>
            <form th:action="@{/admin/doctors/{id}/delete(id=${doctor.id})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit">Удалить</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</div>
</body>
</html>
