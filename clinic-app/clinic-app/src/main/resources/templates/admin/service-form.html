<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Форма услуги</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div class="page">
<h1>Форма услуги</h1>
<nav>
    <a th:href="@{/admin/services}">Услуги</a>
    <a th:href="@{/admin}">Панель администратора</a>
</nav>

<form th:action="${serviceId == null} ? @{/admin/services} : @{/admin/services/{id}(id=${serviceId})}"
      method="post" th:object="${service}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

    <label>
        Название
        <input type="text" th:field="*{name}" required maxlength="100">
    </label>
    <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>

    <label>
        Описание
        <textarea th:field="*{description}" required minlength="10" maxlength="1000"></textarea>
    </label>
    <div th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>

    <label>
        Цена
        <input type="number" th:field="*{price}" required min="0.01" step="0.01">
    </label>
    <div th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>

    <label>
        <input type="checkbox" th:field="*{active}">
        Активна
    </label>

    <button type="submit">Сохранить</button>
</form>
</div>
</body>
</html>
