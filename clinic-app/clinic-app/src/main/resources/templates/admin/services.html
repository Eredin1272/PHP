<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Услуги</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div class="page">
<h1>Услуги</h1>
<nav>
    <a th:href="@{/admin}">Панель администратора</a>
    <a th:href="@{/admin/services/new}">Добавить услугу</a>
</nav>

<table>
    <thead>
    <tr>
        <th>Название</th>
        <th>Описание</th>
        <th>Цена</th>
        <th>Активна</th>
        <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="service : ${services}">
        <td th:text="${service.name}">Название</td>
        <td th:text="${service.description}">Описание</td>
        <td th:text="${service.price}">0.00</td>
        <td th:text="${service.active ? 'Да' : 'Нет'}">Да</td>
        <td>
            <a th:href="@{/admin/services/{id}/edit(id=${service.id})}">Редактировать</a>
            <form th:action="@{/admin/services/{id}/delete(id=${service.id})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit">Удалить</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</div>
</body>
</html>
