<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Личный кабинет</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div class="page">
<h1>Личный кабинет</h1>
<p>Вы вошли в систему.</p>

<nav>
    <a th:href="@{/appointments/new}">Записаться</a>
    <a th:href="@{/appointments/search}">Поиск записей</a>
    <a th:href="@{/admin}" sec:authorize="hasRole('ADMIN')">Панель администратора</a>
</nav>

<section sec:authorize="!hasRole('ADMIN')">
    <h2>Раздел пользователя</h2>
    <p class="muted">Панель администратора доступна только пользователям с ролью администратора.</p>
</section>

<form th:action="@{/logout}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <button type="submit">Выйти</button>
</form>
</div>
</body>
</html>
