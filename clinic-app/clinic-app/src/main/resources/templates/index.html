<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Клиника</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<header>
    <h1>Клиника</h1>
    <nav>
        <a th:href="@{/}">Главная</a>
        <a th:href="@{/appointments/new}">Записаться</a>
        <a th:href="@{/appointments/search}">Поиск записей</a>
        <a th:href="@{/dashboard}">Личный кабинет</a>
        <a th:href="@{/login}">Вход</a>
        <a th:href="@{/register}">Регистрация</a>
    </nav>
</header>

<main>
    <section>
        <h2>Объявления</h2>
        <div class="grid">
        <article class="item" th:each="announcement : ${announcements}">
            <h3 th:text="${announcement.title}">Объявление</h3>
            <p th:text="${announcement.body}">Текст объявления</p>
            <small class="muted" th:text="${announcement.publishedAt}">2026-05-06</small>
        </article>
        </div>
    </section>

    <section>
        <h2>Врачи</h2>
        <div class="grid">
            <article class="item" th:each="doctor : ${doctors}">
                <strong th:text="${doctor.fullName}">Врач</strong>
                <p class="muted">
                    <span th:text="${doctor.specialization}">Специализация</span>,
                    кабинет <span th:text="${doctor.office}">101</span>
                </p>
            </article>
        </div>
    </section>

    <section>
        <h2>Услуги</h2>
        <div class="grid">
            <article class="item" th:each="service : ${services}">
                <strong th:text="${service.name}">Услуга</strong>
                <p th:text="${service.description}">Описание</p>
                <strong th:text="${service.price}">0.00</strong>
            </article>
        </div>
    </section>
</main>
</body>
</html>
